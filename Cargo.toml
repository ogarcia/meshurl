[package]
name = "meshurl"
version = "0.5.0-dev"
edition = "2024"
description = "Meshtastic URL encoder and decoder"
license = "GPL-3.0-or-later"
authors = ["Óscar García Amor <ogarcia@connectical.com>"]
readme = "README.md"
repository = "https://github.com/ogarcia/meshurl"
keywords = ["meshtastic", "decoder", "encoder", "radio", "lora", "cli", "tui"]
categories = ["encoding", "decoder", "command-line-utilities"]

[[bin]]
name = "meshurl"
path = "src/main.rs"

[lib]
name = "meshurl"
path = "src/lib/mod.rs"

[dependencies]
base64 = "0.23"
clap = { version = "4.5", features = ["derive"] }
colored = "3.1"
getrandom = "0.4"
prost = "0.14"
ratatui = "0.30"
ratatui-textarea = "0.9"
sha2 = "0.11"

[target."cfg(unix)".dependencies]
libc = "0.2.189"

[build-dependencies]
prost-build = "0.14"
protox = "0.9"
